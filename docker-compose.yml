version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sunuyaram
      POSTGRES_PASSWORD: sunuyaram
      POSTGRES_DB: sunuyaram
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunuyaram"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://sunuyaram:sunuyaram@db:5432/sunuyaram?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
